<!doctype html>
<!--
  INNEV8 splash screen: standalone, no dependencies. Mirrors components/Intro.tsx.
  Usage:
    /splash.html                 plays the intro, wipes out, then opens the landing page (/)
    /splash.html?next=/path      same, but goes to that same-origin path instead
  Click or press any key to skip ahead.
-->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
  :root {
    --bg: #020611;
    --bg-glow: #0a1a4d;
    --accent: #12bfea;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    --ease-io: cubic-bezier(0.65, 0, 0.35, 1);
  }
  *, ::before, ::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: #f5fbff;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .splash {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .splash__curtain {
    position: absolute;
    inset: 0;
    z-index: -1;
    background: radial-gradient(circle at 50% 45%, var(--bg-glow) 0, var(--bg) 60%);
  }
  .splash__stage {
    display: grid;
    justify-items: center;
    gap: 26px;
  }
  .splash__mark {
    width: clamp(96px, 12vw, 130px);
    aspect-ratio: 727 / 1123;
  }
  .splash__wordmark {
    display: block;
    width: clamp(150px, 18vw, 210px);
    height: auto;
  }

  /* Emblem */
  .i8e { display: block; width: 100%; height: auto; overflow: visible; }
  .i8e-m { fill: none; stroke: #fff; stroke-linecap: round; stroke-linejoin: round; }
  .i8e-m--body { stroke-width: 172; }
  .i8e-m--arrow { stroke-width: 300; stroke-linecap: butt; }
  .i8e-m--ribbon { stroke-width: 150; }
  .i8e-glow { fill: var(--accent); opacity: 0.3; }

  /* Animated build-in (only when JS runs and motion is allowed) */
  .js .i8e-m { stroke-dasharray: 1; stroke-dashoffset: 1; }
  .js .i8e-glow { opacity: 0; }
  .js .i8e-px rect {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    transform: translate(var(--tx), var(--ty)) scale(0.3);
  }
  .js .i8e-m--body { animation: draw 1.25s var(--ease-io) 0.1s forwards; }
  .js .i8e-m--ribbon { animation: draw 0.7s var(--ease-io) 1s forwards; }
  .js .i8e-m--arrow { animation: draw 0.5s cubic-bezier(0.5, 0, 0.2, 1) 1.3s forwards; }
  .js .i8e-px rect { animation: px-assemble 0.8s var(--ease-out) calc(0.25s + var(--d) * 35ms) forwards; }
  .js .i8e-glow { animation: glow-in 0.8s 1.65s forwards; }
  .js .splash__wordmark { opacity: 0; transform: translateY(10px); animation: rise-in 0.9s var(--ease-out) 1.2s forwards; }

  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes px-assemble { to { opacity: 1; transform: none; } }
  @keyframes glow-in { to { opacity: 0.3; } }
  @keyframes rise-in { to { opacity: 1; transform: none; } }

  /* Exit: curtain wipes up while the stage lifts away */
  .splash.is-out {
    pointer-events: none;
    clip-path: inset(0 0 100% 0);
    opacity: 0;
    transition: clip-path 1s var(--ease-io), opacity 0.2s 1s;
  }
  .splash.is-out .splash__stage {
    transform: translateY(-60px);
    opacity: 0;
    transition: transform 1s var(--ease-io), opacity 0.5s;
  }

  @media (prefers-reduced-motion: reduce) {
    .js .i8e-m { stroke-dashoffset: 0; animation: none; }
    .js .i8e-px rect { opacity: 1; transform: none; animation: none; }
    .js .i8e-glow { opacity: 0.3; animation: none; }
    .js .splash__wordmark { opacity: 1; transform: none; animation: none; }
    .splash.is-out, .splash.is-out .splash__stage { transition: none; }
  }
</style>
</head>

<script>
  (function () {
    var MIN_MS = 2400; // let the emblem and wordmark finish building
    var splash = document.getElementById("splash");
    var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

    // Only follow same-origin paths, so ?next= can't be used as an open redirect.
    var next = new URLSearchParams(location.search).get("next");
    if (!next || next.charAt(0) !== "/" || next.charAt(1) === "/" || next.charAt(1) === "\\") next = "/";

    var done = false;
    var timer = 0;

    function finish() {
      if (done) return;
      done = true;
      clearTimeout(timer);
      // Tell the landing page its own intro already played (see BOOT_SCRIPT in app/layout.tsx).
      try { sessionStorage.setItem("i8-intro", "1"); } catch (e) {}
      splash.classList.add("is-out");
      setTimeout(function () { location.replace(next); }, reduced ? 0 : 1000);
    }

    splash.addEventListener("click", finish);
    addEventListener("keydown", finish, { once: true });

    if (reduced) finish();
    else timer = setTimeout(finish, MIN_MS);
  })();
</script>
